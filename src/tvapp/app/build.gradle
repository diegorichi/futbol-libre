plugins { id "com.android.application" }

android {
    namespace "com.futbol.tv"
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "com.futbol.tv"
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName "2.1"
        buildConfigField "int", "APP_VERSION_CODE", "21"
        buildConfigField "String", "SERVER_URL", "\"http://192.168.0.149:8080\""
    }

    buildTypes {
        release {
            // Distribución privada: permite instalar el APK sin crear un secreto en el repo.
            // Para una publicación pública, reemplazar por una signingConfig propia.
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.4.1"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    testImplementation "junit:junit:4.13.2"
}
